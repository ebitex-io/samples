name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter's default mode calls the GitHub API to list a PR's changed files, which needs
# pull-requests: read. Granted explicitly and minimally rather than widening the repo/org default.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determines which sample a change can actually affect, so touching one sample doesn't build
  # every other one. Each sample is a standalone project (see samples/README.md), so there is no
  # shared build to invalidate — the filters really do partition the work.
  #
  # Two details are carried deliberately from the ebitex monorepo's own ci.yml, both learned the
  # hard way there. Do not re-derive them:
  #
  #   1. This workflow file is listed under EVERY filter it controls, so a change to the filter
  #      logic always exercises the jobs that logic governs, rather than risking a broken filter
  #      silently skipping the jobs that would have caught it.
  #
  #   2. `unclassified` needs predicate-quantifier: "every" and its own step. The action's DEFAULT
  #      quantifier ('some') ORs every listed pattern independently, INCLUDING negated ones — so a
  #      bare '**' is unconditionally true and each '!exclusion' after it becomes a silent no-op.
  #      In the monorepo that meant its "docs-only PR skips everything" filter had never once
  #      worked. 'every' requires a file to match every pattern, which for '**' plus a list of
  #      '!X' is exactly the exclusion-list semantics intended. It cannot share a step with
  #      inclusion-list filters, because the quantifier is set per step and a single file cannot
  #      match every one of several mutually-exclusive globs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      northwind-coffee: ${{ steps.filter.outputs.northwind-coffee }}
      northwind-coffee-ssr: ${{ steps.filter.outputs.northwind-coffee-ssr }}
      northwind-coffee-mvc: ${{ steps.filter.outputs.northwind-coffee-mvc }}
      unclassified: ${{ steps.unclassified-filter.outputs.unclassified }}
    steps:
      - uses: actions/checkout@v4

      # One inclusion filter per sample, each naming this workflow alongside its own directory
      # (rule 1 above). Add a filter, an output, and a job when you add a sample -- and add the
      # sample's path to the `unclassified` exclusion list below, or every change to it will
      # additionally run the fail-safe.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            northwind-coffee:
              - 'samples/northwind-coffee/**'
              - '.github/workflows/ci.yml'
            northwind-coffee-ssr:
              - 'samples/northwind-coffee-ssr/**'
              - '.github/workflows/ci.yml'
            northwind-coffee-mvc:
              - 'samples/northwind-coffee-mvc/**'
              - '.github/workflows/ci.yml'

      - uses: dorny/paths-filter@v3
        id: unclassified-filter
        with:
          predicate-quantifier: "every"
          filters: |
            unclassified:
              - '**'
              - '!samples/**'
              - '!.github/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'

  # Enforces the two repository-wide rules that are easy to break by accident and expensive to
  # discover late. Cheap enough to run unconditionally — gating it would save seconds and lose the
  # guarantee.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hardest rule in CONTRIBUTING.md, and the one whose failure is worst: this repository is
      # public and exists to be copied, so a committed key would be published, cloned, and imitated
      # by readers as though it were the intended pattern. .env.example is expected; .env is not.
      - name: No environment files are committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Environment files must never be committed. Found:"
            echo "$found"
            exit 1
          fi
          echo "OK — no committed .env files."

      # Every sample must be recognisable as a standalone project, which is what makes it copyable
      # (samples/README.md). A directory missing either is a half-added sample.
      #
      # "A manifest" rather than "package.json": this rule was written when every sample was a Node
      # project, and northwind-coffee-mvc is a .NET one whose manifest is a .csproj. The rule being
      # enforced is that the directory stands alone and declares its own dependencies — which a csproj
      # does exactly as well. Requiring a package.json would have made a .NET sample carry one for the
      # check's benefit rather than its own, which is the wrong way round.
      - name: Every sample is a standalone project with a README
        run: |
          status=0
          shopt -s nullglob
          for dir in samples/*/; do
            name=$(basename "$dir")

            if [ ! -f "$dir/README.md" ]; then
              echo "::error::samples/$name is missing README.md (see CONTRIBUTING.md)"
              status=1
            fi

            manifests=("$dir"package.json "$dir"*.csproj)
            if [ ${#manifests[@]} -eq 0 ]; then
              echo "::error::samples/$name has no project manifest — expected package.json or a .csproj (see CONTRIBUTING.md)"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "OK — every sample directory is well-formed (or there are none yet)."
          fi
          exit $status

      # The .env rule above catches a key committed in the file that is *meant* to hold one. This one
      # catches a key committed anywhere else — pasted into an appsettings.json, a README, a test
      # fixture. A key is `frm_live_` plus 56 characters from [A-Za-z0-9], which no placeholder or
      # prose can match by accident.
      - name: No API key is committed
        run: |
          found=$(git grep -nE 'frm_live_[A-Za-z0-9]{56}' -- . || true)
          if [ -n "$found" ]; then
            echo "::error::An API key appears to be committed. Rotate it immediately, then remove it:"
            echo "$found"
            exit 1
          fi
          echo "OK — no key-shaped string is committed."

  # The sample is a standalone project with its own lockfile and its own build -- there is no root
  # install and nothing hoisted, which is the point (samples/README.md). `npm ci` therefore runs
  # inside the sample directory, and a green job is real evidence that a reader who copies this
  # directory out on its own gets something that installs and builds.
  northwind-coffee:
    needs: changes
    if: needs.changes.outputs.northwind-coffee == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/northwind-coffee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/northwind-coffee/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`. The typecheck is the half that matters here:
      # every step tag promises it typechecks, and only the composite build actually walks the
      # whole project-reference graph, including the test files.
      - run: npm run build

      - run: npm test

  # The SSR twin of the sample above. Same rules — its own lockfile, its own install, `npm ci` run
  # inside the sample directory — so a green job is real evidence that a reader who copies this one
  # directory out on its own gets something that installs and builds.
  #
  # `npm run build` is `next build`, which typechecks as part of the build rather than as a separate
  # step. There is no `npm test`: this sample's subject is the server, and what is worth asserting
  # about it needs a running server and a seeded organization, neither of which CI has. The static
  # sample's own suite covers the renderers, which are the same files.
  northwind-coffee-ssr:
    needs: changes
    if: needs.changes.outputs.northwind-coffee-ssr == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/northwind-coffee-ssr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/northwind-coffee-ssr/package-lock.json

      - run: npm ci

      # No delivery key here, and that is the point of the check rather than a gap in it: a sample
      # must build without credentials, showing its "not configured yet" page instead of failing.
      - run: npm run build

  # The third build of the same site: ASP.NET Core MVC, Razor, and no client-side framework. Same
  # rules as its two siblings — its own manifest, its own restore, run inside the sample directory —
  # so a green job is evidence that a reader who copies this one directory out gets something that
  # restores from nuget.org and builds.
  #
  # No npm step, deliberately. The sample has a package.json, but it is build-time only: it exists so
  # the stylesheet can be regenerated after editing a view. wwwroot/css/site.css is committed, and
  # running the sample needs `dotnet run` and nothing else.
  northwind-coffee-mvc:
    needs: changes
    if: needs.changes.outputs.northwind-coffee-mvc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/northwind-coffee-mvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Also with no delivery key, for the same reason as the SSR job above.
      - run: dotnet build --no-restore --configuration Release

      # The test project is named explicitly, and there is deliberately no solution file. A solution at
      # the sample root would make `dotnet run` — the first command this sample's README gives a reader
      # — fail with MSB1011, because the folder would then hold both a project and a solution. Naming
      # the test project here costs one path; the alternative costs every reader their first command.
      - run: dotnet test tests/NorthwindCoffee.Mvc.Tests --configuration Release
